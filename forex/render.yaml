services:
  - type: web
    name: forex-chance-api
    runtime: python
    plan: starter
    rootDir: forex/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: bot-state
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STATE_DIR
        value: /data
      - key: STATE_KEY
        sync: false
